# TEMPORARY Step 3 verification environment on Render: ONE Free web service, no worker, no database declared here.
# https://render.com/docs/blueprint-spec
#
# The PostgreSQL database `poster-test-db` (Oregon) was created by hand in the Render dashboard. It is deliberately NOT
# declared under `databases:` so that applying this Blueprint can never create a second database or try to change the
# existing one (its version/region are fixed at creation). The web service only REFERENCES it by name:
# `fromDatabase` -> the database's internal (private network) connection string. Render resolves the name against
# the databases already provisioned in the workspace; `render blueprints validate` checks that it exists.
#
# No secret is stored in this file:
#   * APP_SECRET, SESSION_ENCRYPTION_KEY and SETUP_TOKEN are generated by Render (generateValue) when the
#     Blueprint is first applied, and are visible only in your Render dashboard.
#   * DATABASE_URL is wired from the existing database's internal connection string.
#   * APP_URL is intentionally absent: the app falls back to Render's RENDER_EXTERNAL_URL (https://<name>.onrender.com).
#     The application still refuses a non-https APP_URL in production mode.
#   * Telegram API ID / API hash / phone / codes are never configured here: they are typed into the web form.
#
# APP_ENV is "development" ONLY because the app allows LICENSE_ENFORCEMENT=false in no other mode (there is no
# license server yet). This does not weaken production validation; real customer deployments use production mode.
services:
  - type: web
    name: telegram-auto-poster-test
    runtime: docker
    plan: free
    region: oregon           # must equal the region of the existing database `poster-test-db` (Oregon)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: development
      - key: LICENSE_ENFORCEMENT
        value: "false"
      - key: PORT
        value: "8000"        # the Dockerfile's uvicorn listens on 8000 (Render's default would be 10000)
      - key: AUTO_MIGRATE
        value: "true"        # migrations run at start-up under a PostgreSQL advisory lock (see app/db/migrate.py)
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: poster-test-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
